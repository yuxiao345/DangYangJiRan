<script>
        // Micro-interactions for segments
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function() {
                const parent = this.parentElement;
                if (parent.classList.contains('bg-surface-container-low')) {
                    parent.querySelectorAll('button').forEach(b => {
                        b.classList.remove('bg-surface-container-highest', 'text-primary');
                        b.classList.add('text-on-surface-variant');
                    });
                    this.classList.add('bg-surface-container-highest', 'text-primary');
                    this.classList.remove('text-on-surface-variant');
                }
            });
        });
    </script>
