<script>
        // Toggle Numpad logic
        const trigger = document.getElementById('trigger-numpad');
        const numpadDrawer = document.getElementById('numpad-drawer');
        const amountEl = document.getElementById('amount-display');
        let currentAmount = "0.00";
        let isNumpadVisible = false;

        trigger.addEventListener('click', () => {
            isNumpadVisible = !isNumpadVisible;
            if (isNumpadVisible) {
                numpadDrawer.classList.remove('hidden');
                trigger.querySelector('.material-symbols-outlined').innerText = 'keyboard_arrow_down';
            } else {
                numpadDrawer.classList.add('hidden');
                trigger.querySelector('.material-symbols-outlined').innerText = 'keyboard_arrow_up';
            }
        });

        // Micro-interactions for Numpad
        document.querySelectorAll('.numpad-grid button').forEach(btn => {
            btn.addEventListener('click', () => {
                const val = btn.innerText;
                const icon = btn.querySelector('.material-symbols-outlined');
                
                if (icon && icon.innerText === 'backspace') {
                    if (currentAmount.length > 1) {
                        currentAmount = currentAmount.slice(0, -1);
                    } else {
                        currentAmount = "0";
                    }
                } else {
                    if (currentAmount === "0.00" || currentAmount === "0") {
                        currentAmount = val;
                    } else {
                        currentAmount += val;
                    }
                }
                
                amountEl.innerText = currentAmount;
                
                amountEl.style.transform = 'scale(1.05)';
                setTimeout(() => {
                    amountEl.style.transform = 'scale(1)';
                }, 100);
            });
        });

        // Haptic feel
        document.querySelectorAll('button, .pixel-toggle input').forEach(button => {
            button.addEventListener('touchstart', () => {
                if (window.navigator.vibrate) window.navigator.vibrate(10);
            });
        });
    </script>
