<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>退款界面 - Prismatic Clarity</title>
<!-- Google Fonts: Space Grotesk for Numbers & Headings -->

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                    "surface-container-lowest": "#ffffff",
                    "on-background": "#1c1b1b",
                    "primary-fixed": "#62ff96",
                    "on-surface-variant": "#3c4a3d",
                    "surface-container-high": "#ebe7e7",
                    "on-tertiary": "#ffffff",
                    "on-surface": "#1c1b1b",
                    "tertiary-fixed": "#e2e2e2",

                    "on-secondary-fixed": "#191c1d",
                    "surface-variant": "#e5e2e1",
                    "secondary": "#5c5f60",
                    "on-primary": "#ffffff",
                    "surface-dim": "#dcd9d9",
                    "on-primary-container": "#005326",
                    "inverse-on-surface": "#f3f0ef",
                    "secondary-container": "#e1e3e4",
                    "error-container": "#ffdad6",
                    "on-error-container": "#93000a",
                    "tertiary-fixed-dim": "#c6c6c7",
                    "surface-tint": "#006d35",
                    "primary-container": "#00d16b",
                    "outline": "#6c7b6c",
                    "on-secondary-fixed-variant": "#454748",
                    "surface-container-highest": "#e5e2e1",
                    "secondary-fixed": "#e1e3e4",
                    "on-secondary": "#ffffff",

            "borderRadius": {

<style>
        body {
            background-color: #fcf9f8;
            -webkit-font-smoothing: antialiased;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.04), 
                        inset 0 1px 1px 0 rgba(255, 255, 255, 0.5);
        }

        .luminous-shadow {
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.05);
        }

        .input-underlined {
            border-bottom: 2px solid #EEEEEE;
            transition: border-color 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-underlined:focus {
            border-color: #00D16B;
            outline: none;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .scale-interaction:active {
            transform: scale(0.96);
            transition: transform 0.15s ease;
        }

        /* Webkit Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #e5e2e1;
            border-radius: 10px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-md text-on-surface min-h-screen flex flex-col items-center">
<!-- Top AppBar (Mobile Style Shell) -->
<header class="fixed top-0 z-50 w-full max-w-md bg-white/40 dark:bg-white/10 backdrop-blur-xl border-b border-white/20 shadow-sm flex justify-between items-center px-margin-mobile h-16 rounded-b-xl">
<button class="text-primary font-label-md text-label-md hover:opacity-80 transition-opacity active:scale-95 duration-150">
            取消
        </button>
<h1 class="font-headline-md text-headline-md text-on-surface font-bold">退款</h1>
<button class="text-primary font-label-md text-label-md font-bold hover:opacity-80 transition-opacity active:scale-95 duration-150">
            确认退款
        </button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-md px-margin-mobile pt-24 pb-32 space-y-8">
<!-- Original Transaction Summary Card -->
<section class="space-y-3">
<h2 class="text-on-surface-variant font-label-sm text-label-sm px-1">原交易摘要</h2>
<div class="glass-card rounded-3xl p-6 space-y-4">
<div class="flex justify-between items-center">
<span class="text-on-surface-variant font-body-md">原交易金额</span>
<span class="font-headline-md text-headline-md text-on-surface tabular-nums">¥ 5,000.00</span>
</div>
<div class="w-full h-px bg-on-surface/5"></div>
<div class="flex justify-between items-center">
<span class="text-on-surface-variant font-body-md">原交易日期</span>
<span class="font-body-md text-on-surface">2026年5月20日</span>
</div>
</div>
</section>
<!-- Refund Input Section -->
<section class="space-y-4">
<h2 class="text-on-surface-variant font-label-sm text-label-sm px-1">退款详情</h2>
<div class="glass-card rounded-3xl p-6 space-y-8">
<!-- Amount Field -->
<div class="space-y-2">
<label class="text-on-surface-variant text-sm block">退款金额</label>
<div class="flex items-baseline space-x-2 pb-2 input-underlined">
<span class="text-headline-md font-headline-md">¥</span>
<input class="w-full bg-transparent border-none p-0 text-[32px] font-headline-md focus:ring-0 tabular-nums" placeholder="0.00" type="text" value="5,000.00"/>
</div>
<p class="text-[12px] text-on-surface-variant/70 pt-1">全额退款 ¥ 5,000.00</p>
</div>
<!-- Date Selector -->
<div class="space-y-2">
<label class="text-on-surface-variant text-sm block">退款日期</label>
<div class="flex items-center justify-between p-4 bg-white/40 rounded-2xl border border-white/20 active:bg-white/60 transition-colors cursor-pointer group">
<span class="font-body-md">2026年5月21日</span>
<span class="material-symbols-outlined text-primary group-hover:translate-x-1 transition-transform">calendar_today</span>
</div>
</div>
<!-- Notes Field -->
<div class="space-y-2">
<label class="text-on-surface-variant text-sm block">备注 (可选)</label>
<textarea class="w-full bg-white/20 border border-white/20 rounded-2xl p-4 font-body-md focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all placeholder:text-on-surface-variant/40" placeholder="请输入退款原因或备注..." rows="3"></textarea>
</div>
</div>
</section>
<!-- Dynamic Illustration / Atmosphere -->
<div class="flex justify-center pt-4 opacity-40">
<div class="w-32 h-32 rounded-full bg-gradient-to-tr from-primary-container/20 to-transparent blur-3xl"></div>
</div>
</main>
<!-- Bottom Navigation Bar (Shell Logic) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-8 pt-2 bg-white/40 backdrop-blur-xl border-t border-white/20 rounded-t-3xl shadow-[0_-4px_20px_rgba(0,0,0,0.04)] max-w-md left-1/2 -translate-x-1/2">
<a class="flex flex-col items-center justify-center text-on-surface-variant p-2 scale-interaction" href="#">
<span class="material-symbols-outlined mb-1">receipt_long</span>
<span class="font-label-sm text-[10px]">明细</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant p-2 scale-interaction" href="#">
<span class="material-symbols-outlined mb-1">analytics</span>
<span class="font-label-sm text-[10px]">统计</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container/80 text-on-primary-container rounded-xl p-2 transition-all scale-interaction" href="#">
<span class="material-symbols-outlined mb-1">family_restroom</span>
<span class="font-label-sm text-[10px]">家庭</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant p-2 scale-interaction" href="#">
<span class="material-symbols-outlined mb-1">settings</span>
<span class="font-label-sm text-[10px]">设置</span>
</a>
</nav>
<!-- Interactive Layer for the "Confirm" Button Animation -->
<script>
        document.querySelector('button.text-primary.font-bold').addEventListener('click', function() {
            this.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span>';
            setTimeout(() => {
                this.innerHTML = '<span class="material-symbols-outlined">check_circle</span>';
                this.classList.add('text-primary-container');
                setTimeout(() => {
                    this.innerHTML = '确认退款';
                    this.classList.remove('text-primary-container');
                }, 2000);
            }, 1000);
        });

        // Simple parallax for the background glow
        window.addEventListener('mousemove', (e) => {
            const glow = document.querySelector('.bg-gradient-to-tr');
            if (glow) {
                const moveX = (e.clientX - window.innerWidth / 2) / 50;
                const moveY = (e.clientY - window.innerHeight / 2) / 50;
                glow.style.transform = `translate(${moveX}px, ${moveY}px)`;
            }
        });
    </script>
</body></html>
